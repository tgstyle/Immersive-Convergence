pluginManagement {
    repositories {
        maven { url = 'https://maven.neoforged.net/releases' }
        // maven.parchmentmc.org is offline (connection refused); this mirror
        // serves the same artifacts. Leaving the dead host here fails any
        // plugin resolve that has to look past the repos listed above it.
        maven { url = 'https://ldtteam.jfrog.io/artifactory/parchmentmc-public/' }
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.toString() == 'org.spongepowered.mixin') {
                useModule("org.spongepowered:mixingradle:${requested.version}")
            }
        }
    }
}

rootProject.name = 'ImmersiveConvergence-21'
