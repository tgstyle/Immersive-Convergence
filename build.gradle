import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.37'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.1.6'
    id 'eclipse'
}

configurations.configureEach {
    resolutionStrategy {
        force 'com.google.guava:guava:32.1.3-jre'
    }
}

def versionProps = new Properties()
file('version.properties').withInputStream { versionProps.load(it) }

def gradleProps = new Properties()
file('gradle.properties').withInputStream { gradleProps.load(it) }

version = versionProps.getProperty('version')
ext.version_buildnumber = versionProps.getProperty('build_number')?.toInteger() ?: 0
ext.stage = versionProps.getProperty('stage') ?: ''

println "-> build.gradle applying version: $version (build ${version_buildnumber}) ${stage}"

group = 'mctmods.immersiveconvergence'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.withType(Jar).configureEach {
    zip64 = true
}

ext {
    mod_id = gradleProps['mod_id']
    version_minecraft = versionProps['version_mc']
    version_neoforge = versionProps['version_neoforge']
    version_neoforge_min = versionProps['version_neoforge_min']
    version_parchment = versionProps['version_parchment']
    version_ie_curse = versionProps['version_ie_curse']
    version_ie_min = versionProps['version_ie_min']
    version_jei = versionProps['version_jei']
    version_jade_curse = versionProps['version_jade_curse']
    version_top_curse = versionProps['version_top_curse']
    mod_license = gradleProps['mod_license']
    mod_name = gradleProps['mod_name']
    mod_authors = gradleProps['mod_authors']
    mod_description = gradleProps['mod_description']
}

sourceSets {
    main {
        java { srcDirs = ["$rootDir/src/main/java"] }
        resources {
            srcDirs = [
                    "$rootDir/src/main/resources",
                    "$rootDir/src/generated/resources",
            ]
        }
    }
    datagen {
        java { srcDirs = ["$rootDir/src/datagen/java"] }
        resources { srcDirs = ["$rootDir/src/datagen/resources"] }
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
}

subsystems {
    parchment {
        minecraftVersion = version_minecraft
        mappingsVersion = version_parchment
    }
}

def version_replaces = {
    [
            'version'        : project.version,
            'build_number'   : version_buildnumber,
            'version_mc'     : version_minecraft,
            'version_neoforge' : version_neoforge,
            'version_neoforge_min' : version_neoforge_min,
            'version_ie_min' : "${version_minecraft}-${version_ie_min}",
            'mod_license'    : mod_license,
            'mod_name'       : mod_name,
            'mod_authors'    : mod_authors,
            'mod_description': mod_description,
            'stage'          : stage,
    ] as Map<String, Object>
}

def jsonPatterns = ["**/*.json", "**/*.mcmeta"]

processResources {
    duplicatesStrategy = DuplicatesStrategy.FAIL
    inputs.properties(version_replaces())
    filesMatching("META-INF/neoforge.mods.toml") {
        expand version_replaces()
    }
    exclude ".cache"
    doLast {
        fileTree(dir: outputs.files.asPath, includes: jsonPatterns).each { File file ->
            file.text = JsonOutput.toJson(new JsonSlurper().parse(file, 'UTF-8'))
        }
    }
}

tasks.register('copyModsTomlForIntelliJ', Copy) {
    from processResources.destinationDir
    into "$projectDir/out/production/resources"
    include "META-INF/neoforge.mods.toml"
    dependsOn processResources
}

runs {
    configureEach { run ->
        run.workingDirectory = project.file("run/${run.name}")
    }

    client {
        systemProperties = ['neoforge.enabledGameTestNamespaces': project.mod_id as String]
        arguments = ['--username', 'tgstyle', '--width', '1920', '--height', '1080']
        jvmArguments.addAll '-XX:StartFlightRecording=maxsize=512M,dumponexit=true,filename=logs/profile.jfr,settings=profile'
    }

    server {
        systemProperties = ['neoforge.enabledGameTestNamespaces': project.mod_id as String]
        arguments = ['--nogui']
        jvmArguments.addAll '-XX:StartFlightRecording=maxsize=512M,dumponexit=true,filename=logs/profile.jfr,settings=profile'
    }

    data {
        modSource project.sourceSets.datagen
        programArguments.addAll '--mod', project.mod_id as String, '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
    }
}

repositories {
    maven {
        url = 'https://www.cursemaven.com'
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name 'ParchmentMC'
        url 'https://ldtteam.jfrog.io/artifactory/parchmentmc-public/'
    }
    maven { url = 'https://maven.blamejared.com' }
}

dependencies {
    implementation "net.neoforged:neoforge:${version_neoforge}"
    implementation "curse.maven:${version_ie_curse}"
    compileOnly "mezz.jei:jei-${version_minecraft}-neoforge-api:${version_jei}"
    compileOnly "curse.maven:${version_jade_curse}"
    compileOnly "curse.maven:${version_top_curse}"
}

def customGradle = rootProject.file('custom.gradle')
if (customGradle.exists()) {
    apply from: customGradle
}

tasks.register('bumpVersion') {
    doLast {
        def props = new Properties()
        file('version.properties').withInputStream { props.load(it) }
        def currentBuild = props['build_number'].toInteger()
        def nextBuild = currentBuild + 1
        props['build_number'] = nextBuild.toString()
        file('version.properties').withOutputStream { props.store(it, null) }

        ext.version_buildnumber = nextBuild
        def stage = props['stage'] ?: ''
        def stagePart = stage ? "-${stage}" : ""
        def newVersion = "${props['version']}-b${nextBuild}${stagePart}"

        project.version = newVersion
        tasks.withType(Jar).configureEach {
            it.archiveVersion.set(newVersion)
        }
    }
}

build.dependsOn bumpVersion

tasks.register('sourcesJar', Jar) {
    dependsOn classes
    archiveBaseName.set("ImmersiveConvergence-${version_minecraft}")
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

tasks.register('devJar', Jar) {
    group = 'build'
    description = 'Creates a deobfuscated dev jar for local cross-mod dependencies (used by ImmersiveTechnology)'
    dependsOn classes
    archiveBaseName.set("ImmersiveConvergence-${version_minecraft}")
    archiveClassifier = 'dev'
    from sourceSets.main.output
}

artifacts {
    archives sourcesJar
    archives devJar
}

// Make sure devJar runs with normal builds
assemble.dependsOn devJar
build.dependsOn devJar

tasks.register('genIntellijRunsDummy') {}

tasks.register('speedUpPreRun') {
    doLast {
        ["Client", "Server"].each { s ->
            def runConfigFile = file(".idea/runConfigurations/run${s}.xml")
            if (runConfigFile.exists()) {
                ant.replace(file: runConfigFile, token: "prepareRun${s}", value: "prepareRuns")
                def content = runConfigFile.text
                if (!content.contains('-Dorg.gradle.logging.level=warn')) {
                    ant.replace(file: runConfigFile,
                            token: '<option name="VM_PARAMETERS" value="',
                            value: '<option name="VM_PARAMETERS" value="-Dorg.gradle.logging.level=warn ')
                }
            }
        }
    }
}

tasks.withType(Task).configureEach {
    if (it.name == "genIntellijRuns") {
        it.finalizedBy speedUpPreRun
        genIntellijRunsDummy.dependsOn it
    } else if (it.name == "runServer") {
        it.standardInput = System.in
    }
}

idea {
    project {
        settings {
            taskTriggers {
                afterSync genIntellijRunsDummy
            }
        }
    }
}

processResources.dependsOn bumpVersion
jar.dependsOn bumpVersion
sourcesJar.dependsOn bumpVersion
devJar.dependsOn bumpVersion

jar {
    archiveBaseName.set("ImmersiveConvergence-${version_minecraft}")
    archiveClassifier.set('')
}
