import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.140'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.1.6'
    id 'eclipse'
}

configurations.configureEach {
    resolutionStrategy {
        force 'com.google.guava:guava:32.1.3-jre'
    }
}

def versionProps = new Properties()
file('version.properties').withInputStream { versionProps.load(it) }

def gradleProps = new Properties()
file('gradle.properties').withInputStream { gradleProps.load(it) }

def requestedTasks = gradle.startParameter.taskNames
def releaseBuild = !requestedTasks.any { it.startsWith('run') || it.contains('Client') || it.contains('Server') } && requestedTasks.any { it in ['build', 'jar', 'sourcesJar', 'datagenJar'] }
def currentBuild = versionProps.getProperty('build_number')?.toInteger() ?: 0
ext.version_buildnumber = releaseBuild ? currentBuild + 1 : currentBuild
ext.stage = versionProps.getProperty('stage') ?: ''
version = "${versionProps.getProperty('version')}-b${version_buildnumber}-${stage}"

println "-> build.gradle applying version: $version (build ${version_buildnumber})"

group = 'com.immersiveconvergence'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

tasks.withType(Jar).configureEach {
    zip64 = true
}

sourceSets {
    main {
        java {
            srcDirs = ["$rootDir/src/main/java"]
        }
        resources {
            srcDirs = [
                    "$rootDir/src/main/resources",
                    "$rootDir/src/generated/resources",
            ]
        }
    }
    datagen {
        java {
            srcDirs = ["$rootDir/src/datagen/java"]
        }
        resources {
            srcDirs = ["$rootDir/src/datagen/resources"]
        }
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
    gametest {
        java {
            srcDirs = ["$rootDir/src/gametest/java"]
        }
        resources {
            srcDirs = ["$rootDir/src/gametest/resources"]
        }
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
}

ext {
    mod_id = gradleProps['mod_id']
    version_minecraft = versionProps['version_mc']
    version_forge = versionProps['version_forge']
    version_forge_min = versionProps['version_forge_min']
    version_parchment = versionProps['version_parchment']
    version_mixin = versionProps['version_mixin']
    version_ie_curse = versionProps['version_ie_curse']
    version_ie_min = versionProps['version_ie_min']
    version_jei = versionProps['version_jei']
    version_jade_curse = versionProps['version_jade_curse']
    version_top_curse = versionProps['version_top_curse']
    version_ip_curse = versionProps['version_ip_curse']
    mod_license = gradleProps['mod_license']
    mod_name = gradleProps['mod_name']
    mod_authors = gradleProps['mod_authors']
    mod_description = gradleProps['mod_description']
}

def version_replaces = { [
        'version'      : project.version,
        'build_number' : version_buildnumber,
        'version_mc'   : version_minecraft,
        'version_forge': version_forge,
        'version_forge_min': version_forge_min,
        'version_ie_min': "${version_minecraft}-${version_ie_min}",
        'mod_license'  : mod_license,
        'mod_name'     : mod_name,
        'mod_authors'  : mod_authors,
        'mod_description': mod_description,
        'stage'        : stage,
] as Map<String, Object> }

def jsonPatterns = ["**/*.json", "**/*.mcmeta"]

processResources {
    duplicatesStrategy = DuplicatesStrategy.FAIL
    inputs.properties(version_replaces())
    filesMatching("META-INF/mods.toml") {
        expand version_replaces()
    }
    exclude ".cache"
    doLast {
        fileTree(dir: getOutputs().getFiles().getAsPath(), includes: jsonPatterns).each {
            File file -> file.setText(JsonOutput.toJson(new JsonSlurper().parse(file, 'UTF-8')))
        }
    }
}

tasks.register('copyModsTomlForIntelliJ', Copy) {
    from processResources.destinationDir
    into "$projectDir/out/production/resources"
    include "META-INF/mods.toml"
    dependsOn processResources
}

legacyForge {
    version = "${version_minecraft}-${version_forge}"

    parchment {
        mappingsVersion = project.version_parchment
        minecraftVersion = project.version_minecraft
    }

    accessTransformers.from file('src/main/resources/META-INF/accesstransformer.cfg')
    validateAccessTransformers = true

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.datagen
            sourceSet sourceSets.gametest
        }
    }

    runs {
        client {
            client()
            sourceSet = sourceSets.main
            systemProperty 'forge.logging.markers', ''
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            jvmArgument '-XX:StartFlightRecording=maxsize=512M,dumponexit=true,filename=logs/profile.jfr,settings=profile'
            programArguments.addAll '--username', 'tgstyle', '--width', '1920', '--height', '1080'
        }
        server {
            server()
            sourceSet = sourceSets.main
            systemProperty 'forge.logging.markers', ''
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            jvmArgument '-XX:StartFlightRecording=maxsize=512M,dumponexit=true,filename=logs/profile.jfr,settings=profile'
            programArguments.addAll '--nogui'
        }
        data {
            data()
            sourceSet = sourceSets.datagen
            systemProperty 'forge.logging.markers', ''
            systemProperty 'fml.earlyprogresswindow', 'false'
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').toString(), '--validate',
                    '--existing', sourceSets.main.resources.srcDirs.first().toString()
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            systemProperty 'forge.logging.markers', ''
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        configureEach {
            gameDirectory = project.file('run')
        }
    }
}

repositories {
    maven {
        name = 'Jared maven'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        url = 'https://www.cursemaven.com'
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url = "https://cfa2.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url = 'https://squiddev.cc/maven/'
        content {
            includeGroup("cc.tweaked")
            includeModule("org.squiddev", "Cobalt")
        }
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://ldtteam.jfrog.io/artifactory/parchmentmc-public/'
    }
}

project.ext.lwjglVersion = "3.3.6"
project.ext.lwjglNatives = "natives-linux"

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "mixins.${mod_id}.json"
}

dependencies {
    annotationProcessor "org.spongepowered:mixin:${version_mixin}:processor"
    modImplementation "curse.maven:${version_ie_curse}"
    modCompileOnly "curse.maven:${version_ip_curse}"
    modCompileOnly "mezz.jei:jei-${version_minecraft}-forge-api:${version_jei}"
    modCompileOnly "mezz.jei:jei-${version_minecraft}-common-api:${version_jei}"
    modCompileOnly "curse.maven:${version_jade_curse}"
    modCompileOnly "curse.maven:${version_top_curse}"

    datagenImplementation sourceSets.main.output
}

def customGradle = rootProject.file('custom.gradle')
if (customGradle.exists()) {
    apply from: customGradle
}

tasks.register('bumpVersion') {
    onlyIf { releaseBuild }
    doLast {
        def props = new Properties()
        file('version.properties').withInputStream { props.load(it) }
        props['build_number'] = version_buildnumber.toString()
        file('version.properties').withOutputStream { props.store(it, null) }
    }
}

tasks.register('signJar') {
    dependsOn tasks.named('jar')
    onlyIf { project.hasProperty('keyStore') }
    def jarFile = tasks.named('jar', Jar).flatMap { it.archiveFile }
    doLast {
        // FG6's SignJar task type is gone with ForgeGradle; Ant's signjar is the
        // equivalent and signs in place, as the FG6 config did (in == out).
        ant.signjar(
                jar: jarFile.get().asFile,
                alias: project.storeAlias,
                keystore: project.keyStore,
                storepass: project.storePass,
                keypass: project.storePass
        )
    }
}
if (!project.hasProperty('keyStore')) {
    logger.warn("No key store found, not signing the output jar\n")
}

tasks.register('sourcesJar', Jar) {
    dependsOn classes
    archiveBaseName.set("ImmersiveConvergence-${version_minecraft}")
    archiveClassifier.set('sources')
    from sourceSets.main.allSource
}

tasks.register('devJar', Jar) {
    dependsOn classes
    archiveBaseName.set("ImmersiveConvergence-${version_minecraft}")
    archiveClassifier.set('dev')
    from sourceSets.main.output
    manifest { attributes 'MixinConfigs': "mixins.${mod_id}.json" }
}

artifacts {
    archives sourcesJar
    archives devJar
}

tasks.register('genIntellijRunsDummy')

tasks.register('speedUpPreRun') {
    doLast {
        for (String s in ["Client", "Server"]) {
            def runConfigFile = file(".idea/runConfigurations/run${s}.xml")
            if (runConfigFile.exists()) {
                ant.replace(
                        file: runConfigFile,
                        token: "prepareRun${s}",
                        value: "prepareRuns"
                )
                def content = runConfigFile.text
                if (!content.contains('-Dorg.gradle.logging.level=warn')) {
                    ant.replace(
                            file: runConfigFile,
                            token: '<option name="VM_PARAMETERS" value="',
                            value: '<option name="VM_PARAMETERS" value="-Dorg.gradle.logging.level=warn '
                    )
                }
            }
        }
    }
}

tasks.withType(Task).configureEach {
    if (it.name == "genIntellijRuns") {
        it.finalizedBy speedUpPreRun
        genIntellijRunsDummy.dependsOn it
    } else if (it.name == "runServer") {
        it.standardInput = System.in
    }
}

jar.dependsOn bumpVersion
sourcesJar.dependsOn bumpVersion
devJar.dependsOn bumpVersion
build.dependsOn devJar

jar {
    archiveBaseName.set("ImmersiveConvergence-${version_minecraft}")
    archiveClassifier.set('')
    // MDG's mixin { config } only feeds the dev runs; the release jar must carry
    // the attribute itself or no mixin applies in production.
    manifest { attributes 'MixinConfigs': "mixins.${mod_id}.json" }
}
